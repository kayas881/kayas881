<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0d1124"/>
      <stop offset="100%" stop-color="#191332"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Glow behind HUD Rings -->
    <radialGradient id="hudGlow" cx="725" cy="125" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#4338ca" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070a14" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Pill Background Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b33"/>
      <stop offset="100%" stop-color="#0f1426"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 2px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 0.4px;
      fill: #93c5fd;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 14.5px;
      letter-spacing: 0.2px;
      fill: #cbd5e1;
    }
    .hud-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 8.5px;
      letter-spacing: 1.6px;
      fill: #818cf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #e2e8f0;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="246" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Radial Glow Overlay -->
  <circle cx="725" cy="125" r="170" fill="url(#hudGlow)"/>

  <!-- HUD Graphic Elements (Concentric Tech Rings & Arcs) -->
  <g transform="translate(725, 125)">
    <!-- Outer dashed telemetry ring -->
    <circle r="128" fill="none" stroke="#4338ca" stroke-width="1.2" stroke-dasharray="8, 14" opacity="0.35"/>
    <circle r="118" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.25"/>

    <!-- Segmented focus arcs -->
    <circle r="102" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="85, 175" opacity="0.6"/>
    <circle r="102" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="45, 235" stroke-dashoffset="120" opacity="0.75"/>

    <!-- Data ticks ring -->
    <circle r="84" fill="none" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4, 10" opacity="0.45"/>
    
    <!-- Inner primary circle -->
    <circle r="66" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="145, 45" stroke-dashoffset="30" opacity="0.8"/>
    <circle r="48" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="12, 18" opacity="0.5"/>
    
    <!-- Central Reticle & Axis -->
    <circle r="28" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.45"/>
    <circle r="6" fill="#38bdf8" opacity="0.75"/>
    <line x1="-138" y1="0" x2="-118" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.65"/>
    <line x1="118" y1="0" x2="138" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.65"/>
    <line x1="0" y1="-138" x2="0" y2="-118" stroke="#818cf8" stroke-width="1.5" opacity="0.65"/>
    <line x1="0" y1="118" x2="0" y2="138" stroke="#818cf8" stroke-width="1.5" opacity="0.65"/>
  </g>

  <!-- Telemetry Readouts -->
  <text x="740" y="46" class="hud-text" opacity="0.7">SYS.DIAG // ACTIVE</text>
  <text x="618" y="196" class="hud-text" opacity="0.65">LATENCY &lt; 50MS</text>

  <!-- Left Side Text Content (100% Editable) -->
  <text x="50" y="80" class="title">AYAN SALMANI</text>
  <text x="50" y="118" class="subtitle">Systems &amp; Full-Stack Software Engineer</text>
  <text x="50" y="160" class="desc">Building real-time audio pipelines, autonomous agent</text>
  <text x="50" y="184" class="desc">runtimes, and distributed telemetry platforms.</text>

  <!-- Bottom-Right Action Badges / Pills -->
  <g transform="translate(545, 194)">
    <!-- Portfolio Pill -->
    <g transform="translate(0, 0)">
      <rect width="106" height="32" rx="16" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="14" y="21" class="pill-text">Portfolio 🌐</text>
    </g>

    <!-- LinkedIn Pill -->
    <g transform="translate(116, 0)">
      <rect width="112" height="32" rx="16" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="16" y="21" class="pill-text">LinkedIn 🔗</text>
    </g>

    <!-- Email Pill -->
    <g transform="translate(238, 0)">
      <rect width="98" height="32" rx="16" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="16" y="21" class="pill-text">Email ✉️</text>
    </g>
  </g>
</svg>
