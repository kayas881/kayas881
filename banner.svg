<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Rich Midnight Violet blending into GitHub Dark #0d1117) -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#131627"/>
      <stop offset="100%" stop-color="#1c1630"/>
    </linearGradient>

    <!-- Warm Glowing Border Gradient -->
    <linearGradient id="canvasBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Sunset / Twilight Warm Ambient Glow -->
    <radialGradient id="warmGlow" cx="730" cy="115" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Soft Violet Glow -->
    <radialGradient id="violetGlow" cx="620" cy="70" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm White Typography Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>

    <!-- Waveform Gradient (Warm Amber to Rose to Violet) -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1f33"/>
      <stop offset="100%" stop-color="#121524"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <style>
    .greeting {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 33px;
      letter-spacing: -0.5px;
      fill: url(#nameGrad);
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #c7d2fe;
    }
    .summary {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.15px;
      fill: #cbd5e1;
      line-height: 1.5;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #e2e8f0;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="226" rx="16" fill="url(#canvasBg)" stroke="url(#canvasBorder)" stroke-width="1.2"/>

  <!-- Warm Ambient Glow Layers -->
  <circle cx="730" cy="115" r="190" fill="url(#warmGlow)"/>
  <circle cx="620" cy="70" r="140" fill="url(#violetGlow)"/>

  <!-- Right Side: Warm Harmonic Soundwaves & Orbital Systems Art -->
  <g transform="translate(720, 115)">
    <!-- Harmonic Audio Flow Curves (Warm, Organic Voice Streams) -->
    <path d="M -160,25 C -120,-35 -80,-55 -30,-15 C 20,25 70,35 120,-10 C 145,-30 160,-20 175,-5" 
          fill="none" stroke="url(#waveGrad1)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
          
    <path d="M -150,-15 C -100,35 -50,45 0,0 C 50,-45 100,-25 150,20 C 165,30 175,20 185,10" 
          fill="none" stroke="url(#waveGrad2)" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <path d="M -130,5 C -90,-20 -40,-25 15,10 C 60,40 110,15 155,-25" 
          fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3, 6" opacity="0.4"/>

    <!-- Soft Planetary / Agent Node Orbit -->
    <ellipse rx="135" ry="68" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="6, 12" transform="rotate(-20)" opacity="0.35"/>
    <ellipse rx="100" ry="48" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="60, 30" transform="rotate(30)" opacity="0.4"/>

    <!-- Central Warm Radiant Core -->
    <circle r="36" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.4"/>
    <circle r="22" fill="#ec4899" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.2"/>
    <circle r="7" fill="#fff" opacity="0.95"/>

    <!-- Glowing Signal Nodes -->
    <circle cx="85" cy="-38" r="4.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="-95" cy="28" r="4" fill="#a855f7" opacity="0.85"/>
    <circle cx="45" cy="48" r="3" fill="#38bdf8" opacity="0.75"/>
    <circle cx="-40" cy="-42" r="2.5" fill="#ec4899" opacity="0.7"/>

    <!-- Subtle Twinkling Sparkles -->
    <circle cx="-135" cy="-55" r="1.5" fill="#fef08a" opacity="0.6"/>
    <circle cx="130" cy="55" r="1.2" fill="#ffffff" opacity="0.5"/>
    <circle cx="30" cy="-75" r="1.8" fill="#f43f5e" opacity="0.7"/>
    <circle cx="110" cy="-50" r="1.2" fill="#c084fc" opacity="0.6"/>
  </g>

  <!-- Left Side: Typography (Warm, Inviting, Human) -->
  <text x="44" y="74" class="greeting">Hey there, I'm Ayan <tspan fill="#fbbf24">👋</tspan></text>
  <text x="44" y="108" class="role">Systems &amp; Full-Stack Software Engineer</text>
  
  <text x="44" y="146" class="summary">Building real-time voice pipelines, local agent runtimes,</text>
  <text x="44" y="168" class="summary">and distributed telemetry platforms in Python &amp; TypeScript.</text>

  <!-- Bottom Badges: Status & Focus (Warm, Approachable) -->
  <g transform="translate(44, 186)">
    <g transform="translate(0, 0)">
      <rect width="168" height="26" rx="13" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#10b981"/>
      <text x="26" y="17" class="badge-text">Open to opportunities</text>
    </g>
    
    <g transform="translate(178, 0)">
      <rect width="130" height="26" rx="13" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <text x="13" y="17" class="badge-text">📍 Mumbai, India</text>
    </g>

    <g transform="translate(318, 0)">
      <rect width="144" height="26" rx="13" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <text x="13" y="17" class="badge-text">⚡ 34★ Open Source</text>
    </g>
  </g>
</svg>
