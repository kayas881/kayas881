<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .retro-title {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', Courier, monospace;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 2.5px;
        fill: #faf4eb;
        text-anchor: middle;
      }
      .retro-sub {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', Courier, monospace;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 1.5px;
        fill: #94a3b8;
        text-anchor: middle;
      }
      .btn-text {
        font-family: 'SF Mono', 'Cascadia Code', 'Courier New', monospace;
        font-size: 13.5px;
        font-weight: 700;
        fill: #1c1917;
        letter-spacing: 1px;
      }
      .cursor-blink {
        animation: blink 1s infinite;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background (matches GitHub Dark mode seamlessly) -->
  <rect width="900" height="260" fill="#0d1117"/>

  <!-- Thick Retro Warm Ivory Frame -->
  <rect x="22" y="18" width="856" height="224" rx="4" fill="#0d1117" stroke="#ede8df" stroke-width="6"/>

  <!-- Inner Hairline Frame (vintage retro aesthetic) -->
  <rect x="32" y="28" width="836" height="204" rx="2" fill="none" stroke="#ede8df" stroke-width="1.2" opacity="0.3"/>

  <!-- Centered Name -->
  <text x="450" y="98" class="retro-title">Ayan Salmani</text>

  <!-- Subtitle with Blinking Terminal Cursor -->
  <text x="450" y="138" class="retro-sub">Systems &amp; Full-Stack Engineer <tspan class="cursor-blink">_</tspan></text>

  <!-- Retro Button & Pixel Cursor Group -->
  <!-- Centered at 450: Button is 88px wide, so x = 450 - 44 = 406 -->
  <g transform="translate(406, 162)">
    <!-- Retro Button Box -->
    <rect x="0" y="0" width="88" height="28" rx="2" fill="#e7e5e4" stroke="#1c1917" stroke-width="1.5"/>
    
    <!-- 3D Bevel Highlights -->
    <line x1="1" y1="1" x2="87" y2="1" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="1" y1="1" x2="1" y2="27" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="1" y1="27" x2="87" y2="27" stroke="#78716c" stroke-width="1.5"/>
    <line x1="87" y1="1" x2="87" y2="27" stroke="#78716c" stroke-width="1.5"/>

    <!-- OK Text & Check -->
    <text x="24" y="19" class="btn-text">OK</text>
    <!-- Teal Check Circle -->
    <circle cx="62" cy="14" r="5.5" fill="#0ea5e9"/>
    <path d="M 59.5 14 L 61.2 15.8 L 64.8 12" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Classic 8-Bit Pixel Pointer Hand (Clicking the Button Center) -->
    <!-- Button center is at x=44. Hand index finger tip is at x=6..8, so hand origin at x=44 - 11 = 33 -->
    <g transform="translate(33, 19) scale(1.6)">
      <!-- Pixel Hand Outline -->
      <path d="
        M 5,0 H 8 V 9 H 10 V 7 H 12 V 9 H 14 V 9 H 16 V 16 H 14 V 18 H 12 V 20 H 5 V 18 H 3 V 15 H 1 V 11 H 3 V 9 H 5 Z
      " fill="#000000"/>
      <!-- Pixel Hand Fill -->
      <path d="
        M 6,1 H 7 V 9 H 6 Z
        M 7,9 H 8 V 10 H 7 Z
        M 8,10 H 10 V 8 H 11 V 10 H 10 Z
        M 10,10 H 12 V 8 H 13 V 10 H 12 Z
        M 12,10 H 14 V 10 H 15 V 15 H 14 V 17 H 12 V 19 H 6 V 17 H 4 V 15 H 2 V 12 H 4 V 10 H 5 V 15 H 6 V 9 H 6 Z
      " fill="#fdfbf7"/>
      <!-- Inner Finger Seams -->
      <line x1="9.5" y1="9" x2="9.5" y2="15" stroke="#e2e8f0" stroke-width="0.8"/>
      <line x1="11.5" y1="9" x2="11.5" y2="15" stroke="#e2e8f0" stroke-width="0.8"/>
      <line x1="13.5" y1="10" x2="13.5" y2="15" stroke="#e2e8f0" stroke-width="0.8"/>
    </g>
  </g>
</svg>
